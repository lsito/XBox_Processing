[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xbox_proc"
version = "0.1.0"
description = "Processing tools for Xbox TDMS trend and event data"
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "nptdms",
    "tables"
]

[tool.setuptools.packages.find]
where = ["src"]
